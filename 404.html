<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>404 - Página não encontrada | Dr. Weslley Dias</title>
        <meta name="robots" content="noindex, nofollow" />

        <link rel="stylesheet" href="style.css?v=6" />
        <link rel="icon" type="image/svg+xml" href="imagens/logo.svg" />

        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body {
                background: linear-gradient(135deg, #1a2332 0%, #2c3e50 100%);
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                font-family: "Lato", sans-serif;
                color: #ffffff;
                text-align: center;
                padding: 40px 20px;
            }
            .container {
                max-width: 600px;
            }
            .logo-link {
                display: inline-block;
                margin-bottom: 40px;
            }
            .logo-link img {
                height: 60px;
                width: auto;
            }
            h1 {
                font-family: "Playfair Display", serif;
                font-size: 7rem;
                font-weight: 700;
                color: #a78b50;
                line-height: 1;
                margin-bottom: 10px;
            }
            h2 {
                font-family: "Montserrat", sans-serif;
                font-size: 1.5rem;
                font-weight: 600;
                margin-bottom: 20px;
                color: #e0e0e0;
            }
            p {
                font-size: 1.1rem;
                line-height: 1.6;
                color: #b0b8c4;
                margin-bottom: 35px;
            }
            .btn-voltar {
                display: inline-block;
                background: #a78b50;
                color: #1a2332;
                font-family: "Montserrat", sans-serif;
                font-weight: 700;
                font-size: 1rem;
                padding: 14px 36px;
                border-radius: 8px;
                text-decoration: none;
                transition: all 0.3s ease;
            }
            .btn-voltar:hover {
                background: #c4a86f;
                transform: translateY(-2px);
                box-shadow: 0 4px 15px rgba(167, 139, 80, 0.4);
            }
            @media (max-width: 480px) {
                h1 {
                    font-size: 5rem;
                }
                h2 {
                    font-size: 1.2rem;
                }
                p {
                    font-size: 1rem;
                }
            }
        </style>
    </head>
    <body>
        <div class="container">
            <a href="index.html" class="logo-link">
                <img src="imagens/logo.svg" alt="Dr. Weslley Dias - Advocacia Digital" />
            </a>
            <h1>404</h1>
            <h2>Página não encontrada</h2>
            <p>
                O endereço que você digitou não existe ou foi movido.<br />
                Mas ainda podemos ajudar você com seu caso de Direito Digital.
            </p>
            <a href="index.html" class="btn-voltar">Voltar ao Início</a>
        </div>
    </body>
</html>
