<svg width="140" height="45" viewBox="0 0 140 45" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fundo com gradiente elegante -->
  <rect width="140" height="45" rx="8" fill="url(#grad2)"/>
  <rect x="1" y="1" width="138" height="43" rx="7" stroke="url(#border2)" stroke-width="1.5"/>

  <!-- Ícone de Documento -->
  <g transform="translate(12, 11)">
    <rect x="3" y="1" width="14" height="18" rx="1.5" stroke="#A78B50" stroke-width="1.2" fill="none"/>
    <line x1="6" y1="5" x2="14" y2="5" stroke="#A78B50" stroke-width="1.2"/>
    <line x1="6" y1="9" x2="14" y2="9" stroke="#A78B50" stroke-width="1.2"/>
    <line x1="6" y1="13" x2="12" y2="13" stroke="#A78B50" stroke-width="1.2"/>
    <line x1="6" y1="16" x2="10" y2="16" stroke="#A78B50" stroke-width="1.2"/>
  </g>

  <!-- Texto -->
  <text x="42" y="27" font-family="'Playfair Display', serif" font-size="14" font-weight="600" fill="#FFFFFF">Seção 2</text>

  <!-- Definições de gradientes -->
  <defs>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:rgba(167, 139, 80, 0.15);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgba(167, 139, 80, 0.05);stop-opacity:1" />
    </linearGradient>
    <linearGradient id="border2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#A78B50;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#A78B50;stop-opacity:0.3" />
    </linearGradient>
  </defs>
</svg>
