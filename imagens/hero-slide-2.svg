<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1b2a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1b263b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1b2a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:0.4" />
    </linearGradient>
    <linearGradient id="gold2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#c9a961;stop-opacity:0.5" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bg2)"/>

  <!-- Justice Scale (Balança da Justiça) -->
  <g transform="translate(800, 400)">
    <!-- Base -->
    <rect x="-15" y="200" width="30" height="120" fill="url(#gold2)" opacity="0.8"/>
    <rect x="-80" y="320" width="160" height="20" fill="url(#gold2)" opacity="0.8" rx="5"/>

    <!-- Vertical bar -->
    <rect x="-8" y="0" width="16" height="200" fill="url(#gold2)" opacity="0.7"/>

    <!-- Horizontal bar -->
    <rect x="-200" y="-10" width="400" height="20" fill="url(#gold2)" opacity="0.7" rx="3"/>

    <!-- Left plate -->
    <line x1="-180" y1="0" x2="-180" y2="60" stroke="#c9a961" stroke-width="2" opacity="0.8"/>
    <ellipse cx="-180" cy="80" rx="60" ry="15" fill="url(#gold2)" opacity="0.6"/>
    <ellipse cx="-180" cy="80" rx="60" ry="15" fill="none" stroke="#d4af37" stroke-width="2" opacity="0.8"/>

    <!-- Right plate -->
    <line x1="180" y1="0" x2="180" y2="60" stroke="#c9a961" stroke-width="2" opacity="0.8"/>
    <ellipse cx="180" cy="80" rx="60" ry="15" fill="url(#gold2)" opacity="0.6"/>
    <ellipse cx="180" cy="80" rx="60" ry="15" fill="none" stroke="#d4af37" stroke-width="2" opacity="0.8"/>
  </g>

  <!-- Digital Document -->
  <g transform="translate(400, 200)">
    <rect x="0" y="0" width="200" height="280" fill="#1e3a5f" opacity="0.7" rx="8"/>
    <rect x="0" y="0" width="200" height="280" fill="none" stroke="#667eea" stroke-width="3" opacity="0.8" rx="8"/>

    <!-- Document lines -->
    <line x1="20" y1="40" x2="180" y2="40" stroke="#667eea" stroke-width="2" opacity="0.5"/>
    <line x1="20" y1="70" x2="180" y2="70" stroke="#667eea" stroke-width="2" opacity="0.5"/>
    <line x1="20" y1="100" x2="150" y2="100" stroke="#667eea" stroke-width="2" opacity="0.5"/>
    <line x1="20" y1="130" x2="180" y2="130" stroke="#667eea" stroke-width="2" opacity="0.5"/>
    <line x1="20" y1="160" x2="160" y2="160" stroke="#667eea" stroke-width="2" opacity="0.5"/>

    <!-- Lock overlay -->
    <circle cx="100" cy="220" r="30" fill="#c9a961" opacity="0.8"/>
    <path d="M 90,220 L 95,226 L 108,210" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- LGPD Badge -->
  <g transform="translate(1400, 300)">
    <circle cx="0" cy="0" r="80" fill="#1e3a5f" opacity="0.7"/>
    <circle cx="0" cy="0" r="80" fill="none" stroke="#667eea" stroke-width="4" opacity="0.8"/>
    <text x="0" y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#c9a961">LGPD</text>
    <circle cx="0" cy="0" r="100" fill="none" stroke="#667eea" stroke-width="2" opacity="0.4" stroke-dasharray="10,5"/>
  </g>

  <!-- Tech Elements -->
  <g opacity="0.3">
    <rect x="1200" y="700" width="120" height="80" fill="none" stroke="#667eea" stroke-width="2" rx="5"/>
    <circle cx="1260" cy="740" r="25" fill="#667eea" opacity="0.3"/>
    <path d="M 1250,740 L 1255,745 L 1268,730" fill="none" stroke="#ffffff" stroke-width="2"/>
  </g>

  <!-- Data Flow Lines -->
  <g opacity="0.2" stroke="#667eea" stroke-width="2" fill="none">
    <path d="M 100,800 Q 300,700 500,800 T 900,800"/>
    <path d="M 1000,200 Q 1200,250 1400,200 T 1800,200"/>
    <circle cx="100" cy="800" r="6" fill="#667eea"/>
    <circle cx="900" cy="800" r="6" fill="#667eea"/>
    <circle cx="1000" cy="200" r="6" fill="#667eea"/>
    <circle cx="1800" cy="200" r="6" fill="#667eea"/>
  </g>

  <!-- Hexagonal Pattern -->
  <g opacity="0.1" stroke="#764ba2" stroke-width="1" fill="none">
    <polygon points="200,900 240,920 280,900 280,860 240,840 200,860"/>
    <polygon points="280,900 320,920 360,900 360,860 320,840 280,860"/>
    <polygon points="240,960 280,980 320,960 320,920 280,900 240,920"/>
  </g>

  <!-- Decorative Circles -->
  <circle cx="200" cy="300" r="100" fill="none" stroke="url(#accent2)" stroke-width="2" opacity="0.3"/>
  <circle cx="200" cy="300" r="120" fill="none" stroke="url(#accent2)" stroke-width="1" opacity="0.2"/>
  <circle cx="1700" cy="900" r="80" fill="none" stroke="url(#gold2)" stroke-width="2" opacity="0.3"/>
</svg>
