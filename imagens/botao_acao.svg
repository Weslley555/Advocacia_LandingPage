<svg width="300" height="70" viewBox="0 0 300 70" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fundo com gradiente dourado refinado -->
  <rect width="300" height="70" rx="12" fill="url(#gradAction)"/>
  <rect x="2" y="2" width="296" height="66" rx="10" stroke="url(#borderAction)" stroke-width="2"/>

  <!-- Ícone de WhatsApp estilizado -->
  <g transform="translate(30, 20)">
    <circle cx="15" cy="15" r="14" stroke="#FFFFFF" stroke-width="2" fill="none"/>
    <path d="M21 14.5C21 11.5 18.5 9 15.5 9C12.5 9 10 11.5 10 14.5C10 16 10.5 17.3 11.5 18.3L10 22L13.7 20.5C14.2 20.7 14.8 20.9 15.5 20.9C18.5 20.9 21 18.4 21 14.5Z"
          fill="#FFFFFF"/>
  </g>

  <!-- Texto -->
  <text x="75" y="43" font-family="'Playfair Display', serif" font-size="20" font-weight="700" fill="#FFFFFF">Entre em Contato</text>

  <!-- Definições de gradientes -->
  <defs>
    <linearGradient id="gradAction" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A78B50;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#8B7340;stop-opacity:0.9" />
    </linearGradient>
    <linearGradient id="borderAction" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#D4AF37;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D4AF37;stop-opacity:0.8" />
    </linearGradient>
  </defs>
