<svg width="140" height="45" viewBox="0 0 140 45" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fundo com gradiente elegante -->
  <rect width="140" height="45" rx="8" fill="url(#grad3)"/>
  <rect x="1" y="1" width="138" height="43" rx="7" stroke="url(#border3)" stroke-width="1.5"/>

  <!-- Ícone de Martelo (Justiça) -->
  <g transform="translate(12, 11)">
    <rect x="12" y="1" width="5.5" height="10" rx="0.8" stroke="#A78B50" stroke-width="1.2" fill="none"/>
    <rect x="5.5" y="9.5" width="7" height="2.8" rx="0.8" stroke="#A78B50" stroke-width="1.2" fill="none"/>
    <line x1="9" y1="11" x2="3.5" y2="16.5" stroke="#A78B50" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="1.5" y="16.5" width="4" height="2.8" rx="0.8" stroke="#A78B50" stroke-width="1.2" fill="none"/>
  </g>

  <!-- Texto -->
  <text x="42" y="27" font-family="'Playfair Display', serif" font-size="14" font-weight="600" fill="#FFFFFF">Seção 3</text>

  <!-- Definições de gradientes -->
  <defs>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:rgba(167, 139, 80, 0.15);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgba(167, 139, 80, 0.05);stop-opacity:1" />
    </linearGradient>
    <linearGradient id="border3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#A78B50;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#A78B50;stop-opacity:0.3" />
    </linearGradient>
  </defs>
</svg>
