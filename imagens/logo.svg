<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f4d03f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0b400;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Escudo -->
  <path d="M 50 22 L 70 16 L 90 22 L 90 52 C 90 68 80 78 70 83 C 60 78 50 68 50 52 Z"
        fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Balança -->
  <g transform="translate(70, 46)">
    <line x1="0" y1="0" x2="0" y2="26" stroke="#e8c547" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-15" y1="5" x2="15" y2="5" stroke="#e8c547" stroke-width="2.5" stroke-linecap="round"/>
    <g transform="translate(-15, 5)">
      <line x1="0" y1="0" x2="-6" y2="8" stroke="#e8c547" stroke-width="1.5"/>
      <line x1="0" y1="0" x2="6" y2="8" stroke="#e8c547" stroke-width="1.5"/>
      <ellipse cx="0" cy="10" rx="7" ry="2" fill="url(#goldGradient)" opacity="0.9"/>
    </g>
    <g transform="translate(15, 5)">
      <line x1="0" y1="0" x2="-6" y2="8" stroke="#e8c547" stroke-width="1.5"/>
      <line x1="0" y1="0" x2="6" y2="8" stroke="#e8c547" stroke-width="1.5"/>
      <ellipse cx="0" cy="10" rx="7" ry="2" fill="url(#goldGradient)" opacity="0.9"/>
    </g>
    <ellipse cx="0" cy="27" rx="8" ry="2.5" fill="url(#goldGradient)"/>
  </g>

  <!-- Elementos digitais (pixels) -->
  <rect x="46" y="28" width="3" height="3" fill="#ffffff" opacity="0.4"/>
  <rect x="46" y="35" width="3" height="3" fill="#ffffff" opacity="0.6"/>
  <rect x="91" y="28" width="3" height="3" fill="#ffffff" opacity="0.4"/>
  <rect x="91" y="35" width="3" height="3" fill="#ffffff" opacity="0.6"/>

  <!-- Texto -->
  <text x="115" y="49" font-family="'Montserrat', 'Arial', sans-serif" font-size="28" font-weight="700" fill="#ffffff" letter-spacing="1">
    ADVOCACIA
  </text>
  <text x="115" y="76" font-family="'Montserrat', 'Arial', sans-serif" font-size="24" font-weight="400" fill="#e8c547" letter-spacing="2">
    DIGITAL
