<svg width="140" height="45" viewBox="0 0 140 45" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fundo com gradiente elegante -->
  <rect width="140" height="45" rx="8" fill="url(#grad1)"/>
  <rect x="1" y="1" width="138" height="43" rx="7" stroke="url(#border1)" stroke-width="1.5"/>

  <!-- Ícone de Balança (Justiça) -->
  <g transform="translate(12, 12)">
    <path d="M10.5 2L7 8.5H14L10.5 2Z" stroke="#A78B50" stroke-width="1.2" fill="none"/>
    <line x1="10.5" y1="2" x2="10.5" y2="19" stroke="#A78B50" stroke-width="1.2"/>
    <line x1="6" y1="19" x2="15" y2="19" stroke="#A78B50" stroke-width="1.5"/>
    <circle cx="7" cy="8.5" r="4.5" stroke="#A78B50" stroke-width="1.2" fill="none"/>
    <circle cx="14" cy="8.5" r="4.5" stroke="#A78B50" stroke-width="1.2" fill="none"/>
  </g>

  <!-- Texto -->
  <text x="42" y="27" font-family="'Playfair Display', serif" font-size="14" font-weight="600" fill="#FFFFFF">Seção 1</text>

  <!-- Definições de gradientes -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:rgba(167, 139, 80, 0.15);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgba(167, 139, 80, 0.05);stop-opacity:1" />
    </linearGradient>
    <linearGradient id="border1" x1="0%" y1="0%" x2="100%" y2="0%">
